<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEATHER_APP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https:fonts.gstatic.com" crossorigin />

    <link rel="stylesheet" href="style.css">

</head>

<body>
    <div class="wrapper">
        <h1>Weather App</h1>
        <div class="tab-container">
            <p class="tab" data-userWeather>Your Weather</p>
            <p class="tab" data-searchWeather>Search Container</p>
        </div>

        <div class="weather-container">
            <!-- grant location container -->
            <div class="grant-location-container sub-container">
                <img src="./images/location.png" width="80" height="80" loading="lazy">
                <p>grant Location Access</p>
                <p>Allow Access to get weather Information</p>
                <button class="Btn" data-grantAccess>Grant Access</button>
            </div>


            <!-- search Form -->
            <form class="form-container" data-searchForm>
                <input placeholder="search for city..." data-searchInput />
                <button class="btn" type="submit">
                    <img src="./images/search.png" width="20" height="20" loading="lazy">
                </button>
            </form>

            <!-- loading screen container -->
            <div class="loading-container">
                <img src="./images/loading.gif" width="150" height="150" loading="lazy">
                <p>Loading</p>

            </div>

            <!-- error box -->
            <div class="error-container">
                <img src="./images/error-message.png" width="150" height="150">
                <p class="error-message">City not found</p>
            </div>

            <!-- show weatherr info -->

            <div class="user-info-container sub-container">

                <!-- city name & flag -->
                <div class="name">
                    <p data-cityName></p>
                    <img data-countryFlag src="">
                </div>

                <!-- weather descriptution -->

                <p data-weatherDesc></p>
                <img data-weatherIcon>
                <p data-temp></p>

                <!-- 3 card -->
                <div class="parameter-container">

                    <!--wind card 1 -->
                    <div class="parameter">
                        <img src="./images/wind.png">
                        <p>Windspeed</p>
                        <p data-windspeed></p>
                    </div>

                    <!-- humidity card-2 -->
                    <div class="parameter">
                        <img src="./images/humidity.png">
                        <p>Humidity</p>
                        <p data-humidity></p>
                    </div>

                    <!--cloud card-3  -->
                    <div class="parameter">
                        <img src="./images/clouds.png">
                        <p>Cloud</p>
                        <p data-cloud></p>
                    </div>
                </div>
            </div>


        </div>

        <script src="script.js"></script>
</body>

</html>
